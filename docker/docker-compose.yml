name: hamstore_laravel

services:
  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: hamstore_laravel_app
    volumes:
      - ../:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hamstore

  nginx:
    image: nginx:alpine
    container_name: hamstore_laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hamstore

  db:
    image: postgres:16
    container_name: hamstore_laravel_db
    environment:
      POSTGRES_DB: hamstore
      POSTGRES_USER: hamstore
      POSTGRES_PASSWORD: secret
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamstore -d hamstore"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - hamstore

networks:
  hamstore:
    driver: bridge

volumes:
  pgdata:
